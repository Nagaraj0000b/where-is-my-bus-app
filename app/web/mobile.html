<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where Is My Bus — mobile web preview</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #151515 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #8a8a8a;
      font-size: 10px;
      letter-spacing: 0.18em;
      font-weight: 600;
      white-space: nowrap;
    }
    .phone {
      width: 390px;
      height: 760px;
      border: 10px solid #0b0b0b;
      border-radius: 46px;
      overflow: hidden;
      background: #f6f6f3;
      box-shadow: 0 30px 90px rgba(0,0,0,0.65), 0 0 0 1px #333 inset;
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 22px;
      background: #0b0b0b;
      border-radius: 0 0 14px 14px;
      z-index: 2;
      pointer-events: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="label">WHERE IS MY BUS · MOBILE WEB PREVIEW</div>
  <div class="phone">
    <iframe src="/" title="Where Is My Bus"></iframe>
  </div>
</body>
</html>
